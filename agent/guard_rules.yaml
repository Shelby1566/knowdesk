version: "1.0"
rules:
  - id: "R01_UNWRAP_MALFORMED_DISPATCH"
    action: "block"
  - id: "R02_PROMPT_INJECTION_PAYLOAD"
    action: "block"
    blocked_substrings:
      - "ignore previous instructions"
      - "system override"
      - "transfer all funds to"
      - "drop table"
      - "<script>"
  - id: "R03_REQUIRE_UNLOCK_BEFORE_DISCOVERABLE_CALL"
    action: "block"
  - id: "R04_HIGH_RISK_WRITE_VERIFICATION_AND_APPROVAL"
    high_risk_prefixes:
      - "freeze_"
      - "close_"
      - "cancel_"
      - "transfer_"
      - "wire_"
      - "update_"
      - "change_"
      - "reset_"
      - "issue_"
      - "refund_"
      - "dispute_"
      - "waive_"
      - "lock_"
      - "replace_"
    read_or_verify_tools:
      - "get_user_details"
      - "get_account_details"
      - "get_credit_card_details"
      - "get_transaction_history"
      - "lookup_user"
      - "verify_user"
      - "authenticate_user"
      - "KB_search"
      - "grep"
      - "unlock_discoverable_agent_tool"
      - "list_discoverable_agent_tools"
  - id: "R05_DYNAMIC_SCHEMA_VALIDATION"
    action: "block"
    description: "Validate required parameters against dynamically discovered tool schemas captured at runtime"
