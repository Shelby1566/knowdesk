services:
  knowdesk-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - KNOWDESK_CHECKPOINTER_BACKEND=sqlite
      - KNOWDESK_DB_PATH=/app/data/knowdesk.sqlite
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    volumes:
      - ./data:/app/data
    env_file:
      - .env.example
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "16686:16686"
      - "4318:4318"
