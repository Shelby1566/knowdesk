syntax = "proto3";

package knowdesk.v1;

// Google 生产级 gRPC 服务契约 (Enterprise Proto3 Definition)

message ChatMessage {
  string role = 1;
  string content = 2;
  string tool_call_id = 3;
  string name = 4;
}

message StreamChatRequest {
  string session_id = 1;
  string content = 2;
  string tenant_id = 3;
  string user_id = 4;
  int32 clearance_level = 5;
}

message StreamChatEvent {
  string event_type = 1; // "node_transition", "awaiting_approval", "done", "error"
  string node_name = 2;
  string payload_json = 3;
  double timestamp = 4;
}

message ApprovalRequest {
  string session_id = 1;
  string decision = 2; // "approve", "reject", "modify"
  string reason = 3;
  string idempotency_key = 4;
  string modified_args_json = 5;
}

message ApprovalResponse {
  string session_id = 1;
  string status = 2;
  string decision = 3;
  string reply = 4;
}

message KnowledgeSearchRequest {
  string query = 1;
  int32 top_k = 2;
  string tenant_id = 3;
  int32 clearance_level = 4;
}

message KnowledgeDocument {
  string doc_id = 1;
  string title = 2;
  string content = 3;
  double score = 4;
}

message KnowledgeSearchResponse {
  repeated KnowledgeDocument documents = 1;
}

service KnowDeskAgentService {
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatEvent);
  rpc SubmitApproval(ApprovalRequest) returns (ApprovalResponse);
  rpc SearchKnowledge(KnowledgeSearchRequest) returns (KnowledgeSearchResponse);
}
