name: KnowDesk Unit Tests CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KnowDesk
        uses: actions/checkout@v4

      - name: Clone tau2-bench at commit 033bf08
        run: |
          git clone https://github.com/sierra-research/tau2-bench.git ../tau2-bench
          git -C ../tau2-bench checkout 033bf08

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies and run all 24 unit tests
        run: |
          uv venv --python 3.12
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e "../tau2-bench[knowledge]" faiss-cpu sentence-transformers "langgraph>=1.2.12,<2" "langgraph-checkpoint-sqlite>=3.0.0" "mcp>=2.0.0,<3" pytest httpx
          uv run --no-sync pytest -v -W ignore
