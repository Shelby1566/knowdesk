name: KnowDesk Unit Tests CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KnowDesk
        uses: actions/checkout@v4
        with:
          path: knowdesk

      - name: Checkout pinned tau2-bench (033bf08)
        uses: actions/checkout@v4
        with:
          repository: sierra-research/tau2-bench
          ref: 033bf08
          path: tau2-bench

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies (CPU fast mode) and run all 24 tests
        working-directory: knowdesk
        run: |
          uv venv --python 3.12
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e "../tau2-bench[knowledge]" faiss-cpu sentence-transformers "langgraph>=1.2.12,<2" "langgraph-checkpoint-sqlite>=3.0.0" "mcp>=2.0.0,<3" pytest httpx
          uv run --no-sync pytest -v -W ignore
