name: KnowDesk Unit Tests CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned tau2-bench (033bf08)
        run: |
          git clone https://github.com/sierra-research/tau2-bench.git ../tau2-bench
          git -C ../tau2-bench checkout 033bf08
      - uses: astral-sh/setup-uv@v4
      - name: Run unit tests
        run: |
          uv sync
          uv run --no-sync pytest -v -W ignore -k "not consistency"
