name: KnowDesk Offline Unit Tests CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Sync dependencies and run offline unit tests
        run: |
          uv sync
          uv run --no-sync pytest -v -m "not live" -W ignore
